# Pages CMS — 공개 작품 정보만 편집합니다. 토큰/비밀번호를 넣지 마세요.
media:
  input: assets
  output: assets
  extensions: [jpg, jpeg, png, webp, avif]
  rename: safe

content:
  - name: portfolio
    label: 포트폴리오 작품 관리
    type: file
    path: portfolio.json
    format: json
    fields:
      - name: projects
        label: 작품 목록
        type: object
        list: true
        fields:
          - name: title
            label: 작품 이름
            type: string
            required: true
          - name: description
            label: 작품 설명
            type: text
            required: true
          - name: tags
            label: 사용 기술
            type: string
            list: true
          - name: siteUrl
            label: 사이트 주소
            type: string
            description: 공개한 http 또는 https 주소를 입력하세요. 미공개 작품은 비워 둡니다.
            pattern:
              regex: '^(https?://[^\s]+)?$'
              message: http:// 또는 https://로 시작하는 주소를 입력하세요.
          - name: codeUrl
            label: 공개 코드 주소
            type: string
            description: 공개 저장소 주소를 입력하세요. 없으면 비워 둡니다.
            pattern:
              regex: '^(https?://[^\s]+)?$'
              message: http:// 또는 https://로 시작하는 주소를 입력하세요.
          - name: image
            label: 대표 이미지
            type: image
            description: assets에서 선택하거나 새 이미지를 업로드하세요.
            options:
              extensions: [jpg, jpeg, png, webp, avif]
              rename: safe
settings:
  content:
    merge: false
  commit:
    identity: app
